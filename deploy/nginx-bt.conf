# 膳语后端反向代理配置
# 宝塔面板使用方式:
# 1. 在宝塔面板 → 网站 → 添加站点
# 2. 域名填: shanyushipu.top
# 3. 根目录随便填（如 /www/wwwroot/shanyushipu）
# 4. 保存后点击"设置" → "配置文件"
# 5. 把这段内容添加到 server 块里（或替换整个配置）

server {
    listen 80;
    server_name shanyushipu.top www.shanyushipu.top;
    
    # 日志
    access_log /www/wwwlogs/shanyushipu.log;
    error_log /www/wwwlogs/shanyushipu.error.log;
    
    # 允许大文件上传（OCR需要）
    client_max_body_size 10M;
    
    # API 反向代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持（如果有需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # 健康检查（可选）
    location /health {
        proxy_pass http://127.0.0.1:8787/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # 首页（可选，放个简单的状态页）
    location / {
        proxy_pass http://127.0.0.1:8787/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
